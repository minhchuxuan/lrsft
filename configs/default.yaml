# Default: Qwen3-0.6B-Base on 1x H100 80GB. Budget ~25 H100-h for A + B + extras (see README).
# Scale with --set, e.g. --set rl.rounds=40 data.sft_num_samples=10000, or layer configs/fast.yaml on top.
seed: 1234

paths:
  work: outputs        # models, checkpoints, rollouts (~45 GB); env LRSFT_WORK overrides
  results: results     # small JSON/CSV/figures
  logs: logs

model:
  name: Qwen/Qwen3-0.6B-Base   # 28 layers, tied embeddings
  attn_implementation: sdpa    # HF side (SFT, probes, GRPO loss); vLLM uses its own kernels
  tiny: null

train:
  bf16: true          # bf16 autocast over fp32 master weights
  use_cpu: false

data:
  sft_source: open-r1/OpenR1-Math-220k
  sft_config: default
  sft_num_samples: 15000
  sft_max_tokens: 4096         # prompt + correct R1 trace
  rl_source: math              # math (MATH train) | dapo (DAPO-Math-17k, harder for 0.6B)
  rl_levels: [3, 4, 5]
  rl_num_prompts: null
  probe_levels: [1, 2, 3, 4, 5] # probe pool: all MATH levels (theta_0 solves few level 3-5 problems)
  probe_pool_size: 768         # fixed prompts used by every layer probe / dead-group measurement
  eval_source: HuggingFaceH4/MATH-500
  synthetic: null

gen:
  backend: vllm
  gpu_memory_utilization: 0.85
  score_workers: 16

probe:                         # A1 / A3 layer ranking
  num_samples: 8               # rollouts per prompt (GRPO group)
  batch_prompts: 64            # informative prompt groups per batch
  num_batches: 3               # independent batches -> error bars / rank stability
  micro_batch_size: 4
  lm_head_chunk: 1024          # tokens per LM-head chunk (fp32 logits: chunk x 152k x 4 bytes)
  acc_device: null             # "cpu" keeps the gradient sum off small GPUs

select:
  k: 2
  metric: grad_norm            # grad_norm | fisher | snr | rel_grad
  exclude_layers: []
  override: null               # e.g. [13, 15] to force R

sft:
  save_epochs: [1, 3, 8]       # SFT depths
  lr: 3.0e-5
  scheduler: constant_with_warmup
  warmup: 0.03
  per_device_batch_size: 16
  grad_accum: 2                # 32 sequences / step
  weight_decay: 0.0
  max_grad_norm: 1.0
  logging_steps: 10
  save_steps: 200              # resume checkpoints (fp32 + optimizer, only the latest is kept)

eval:                          # MATH-500
  n: 16
  temperature: 0.6
  top_p: 0.95
  max_tokens: 4096
  ks: [1, 2, 4, 8, 16]
  keep_completions: 2
  entropy_samples: 200
  cka_samples: 64
  cka_tokens: 4096
  limit: null

rl:                            # B: GRPO + DAPO tricks
  depths: [8, 1, 3]            # run order: deepest SFT first
  rounds: 60                   # rollout batches; each = prompts_per_round x num_generations
  warmup_rounds: 1
  prompts_per_round: 64
  num_generations: 8
  per_device_batch_size: 8
  grad_accum: 16               # 128 rollouts / update -> 4 updates per round (clip-higher matters)
  lr_subset: 5.0e-6            # RL on 2 layers only
  lr_full: 1.0e-6              # full-parameter baseline
  epsilon: 0.2
  epsilon_high: 0.28
  mask_truncated: true
  scale_rewards: group
  max_grad_norm: 1.0
  temperature: 1.0
  max_completion_tokens: 4096
  use_vllm: true
  vllm_gpu_memory_utilization: 0.45
  is_mode: token_truncate      # vLLM/HF mismatch correction (TIS), ratio clipped at 3
  save_every_rounds: 10

extras:                        # at the deepest full-SFT checkpoint
  random_R: true
  reselected_R: true
  full_param: true
  rl_from_base: false

debug:
  fake_reward: false
